name: Publish brand asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the HACS brand icon
        run: |
          mkdir -p brand
          echo '' | base64 --decode > brand/icon.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/icon.png
          git rm .github/workflows/publish_brand.yml
          git commit -m "Add HACS brand icon"
          git push
